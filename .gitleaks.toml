# Falsos positivos típicos de juegos web. Ajustar el prefijo de las claves de guardado.
[extend]
useDefault = true

[allowlist]
description = "Claves de localStorage y claves publicables (públicas por diseño)"
regexTarget = "secret"
regexes = [
  '''^(ruta01_)[a-z0-9_.]+$''',
  '''^sb_publishable_[A-Za-z0-9_-]+$''',
]
