name: NPC Pixel Art

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "art/npcs.px.js"
      - "tools/build-npc-pixel-art.mjs"
      - "package.json"
      - ".github/workflows/npc-pixel-art.yml"
  push:
    branches:
      - main
      - "narrative/**"
    paths:
      - "art/npcs.px.js"
      - "tools/build-npc-pixel-art.mjs"
      - "package.json"
      - ".github/workflows/npc-pixel-art.yml"

permissions:
  contents: write

jobs:
  build-npc-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Build claude-pxl portraits
        run: npm run build:npc-art
      - name: Publish generated portraits to the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pixel/npcs/sprites/*.png assets/pixel/npcs/npc_portraits.png
          if git diff --cached --quiet; then
            echo "Generated portraits are already up to date."
          else
            git commit -m "Publish generated NPC pixel portraits"
            git push
          fi
      - name: Upload generated portraits
        uses: actions/upload-artifact@v4
        with:
          name: piel-de-cloro-npc-pixel-art
          path: assets/pixel/npcs/
          if-no-files-found: error
          retention-days: 14
